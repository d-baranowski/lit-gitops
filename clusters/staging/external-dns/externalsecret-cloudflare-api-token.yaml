# Same Terraform-minted Cloudflare token as cert-manager uses, materialized into
# the external-dns namespace. Two ExternalSecrets rather than one because
# Kubernetes Secrets are namespaced and both workloads need it locally; the
# ClusterSecretStore is cluster-scoped so a single Secrets Manager entry backs
# both, and a rotation updates both within refreshInterval.
#
# The token's scope (DNS:Write + Zone:Read on inspi.cloud) is exactly what
# external-dns needs too — no second credential required.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: external-dns
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: lit/staging/cloudflare
        property: api_token
