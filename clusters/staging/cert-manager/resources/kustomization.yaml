apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The Cloudflare token ExternalSecret deliberately lives in ../secrets, gated by
# its own Flux Kustomization that this one dependsOn. Applying it here raced the
# ClusterIssuers and left them permanently InvalidSolver — see
# ../secrets/kustomization.yaml for the full account.
resources:
  - clusterissuer-letsencrypt-staging.yaml
  - clusterissuer-letsencrypt-prod.yaml
