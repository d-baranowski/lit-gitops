# Cloudflare API token for the ACME DNS-01 solver, materialized from AWS Secrets
# Manager by ESO.
#
# The token is MINTED BY TERRAFORM, not created by hand — see
# infrastructure/environments/staging/cloudflare-dns01.tf. It is zone-scoped to
# inspi.cloud with only DNS:Write + Zone:Read, and nobody ever handles its value.
# Rotate with:
#   terraform apply -replace='cloudflare_api_token.cert_manager_dns01[0]'
#
# Must live in the cert-manager namespace: ClusterIssuer secret references are
# resolved in cert-manager's "cluster resource namespace" (where the controller
# runs), NOT in the namespace of the Gateway, Certificate or HTTPRoute.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
  data:
    # secretKey uses a hyphen (the key cert-manager reads); the remote JSON
    # property uses an underscore, matching externalsecrets-app.yaml's convention.
    - secretKey: api-token
      remoteRef:
        key: lit/staging/cloudflare
        property: api_token
