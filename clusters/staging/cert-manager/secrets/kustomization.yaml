apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The Cloudflare DNS-01 token, split into its own Kustomization so it is proven
# SYNCED before any ClusterIssuer that references it is applied.
#
# Why this exists — a one-second race broke TLS for 2h20m on 2026-07-29:
#
#   09:28:49  cert-manager evaluates letsencrypt-prod -> secret not found
#             -> Ready=False, reason InvalidSolver
#   09:28:50  ESO creates cloudflare-api-token          (one second later)
#
# and cert-manager never re-evaluated. Its issuer controller does not watch the
# referenced Secret, so the issuer sat InvalidSolver indefinitely while the
# secret existed and was perfectly valid the whole time. Every Certificate
# behind it stayed Pending with "Referenced issuer does not have a Ready status
# condition", the Gateway's https listener never programmed, and the public
# endpoint served nothing.
#
# Previously the ExternalSecret and the ClusterIssuers were in the same
# Kustomization, so nothing ordered them — they were applied in one batch and it
# came down to which reconciled first.
#
# Gating works here specifically because ExternalSecret has a real Ready
# condition that kstatus understands (SecretSynced). That is NOT true of
# ClusterIssuer — see the caution in cert-manager-resources-kustomization.yaml —
# which is exactly why the gate has to be on this side of the dependency.
resources:
  - externalsecret-cloudflare-api-token.yaml
