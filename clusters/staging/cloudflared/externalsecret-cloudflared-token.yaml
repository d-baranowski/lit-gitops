# Cloudflare Tunnel token, materialized from AWS Secrets Manager by ESO.
#
# Minted by Terraform (infrastructure/environments/staging/cloudflare-grafana.tf)
# and written straight into Secrets Manager — nobody ever handles the value.
# Rotate with:
#   terraform apply -replace='cloudflare_zero_trust_tunnel_cloudflared.grafana[0]'
# then restart the Deployment (the token is read once at process start):
#   kubectl -n observability rollout restart deployment/cloudflared
#
# The token is the tunnel's whole identity: anything holding it can register as a
# connector for this tunnel. It does NOT grant access to Grafana — that is
# Cloudflare Access's job, and every request still has to satisfy the Access
# policy before Cloudflare will proxy it down the tunnel.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-token
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: cloudflared-token
    creationPolicy: Owner
    # Retain: a transient Secrets Manager failure should not delete the Secret
    # out from under a running tunnel and take Grafana offline.
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: lit/staging/grafana
        property: tunnel_token
