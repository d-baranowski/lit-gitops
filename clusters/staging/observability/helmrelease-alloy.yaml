apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: observability
spec:
  interval: 5m
  chart:
    spec:
      chart: alloy
      version: "1.11.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    timeout: 10m
    # See helmrelease-kube-prometheus-stack.yaml: without retries a single failed
    # install stalls permanently and leaves a failed Helm release behind.
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
      strategy: rollback
      # Rollback BETWEEN retries is fine — it restores a working release while
      # the next attempt runs. Rolling back after the LAST retry is not: it
      # reverts the very change that was meant to fix the failure, so a fix that
      # is itself a config or resource change can never land. The release then
      # sits failed on the old config with no retries left.
      remediateLastFailure: false
  values:
    # Grafana Alloy, not Promtail. Promtail reached end of life in March 2026 and
    # takes no further fixes; Alloy is its supported successor and reads the same
    # pod logs into the same Loki.
    fullnameOverride: alloy

    controller:
      # One collector per node, each reading only its own node's pods (see the
      # field selector below). Two extra pods today, one per additional node as
      # the cluster scales.
      type: daemonset

      # Same reason as node-exporter: on a node already at the 17-pod ceiling a
      # priority-0 DaemonSet pod can neither schedule nor preempt, and Cluster
      # Autoscaler will not scale up for it. A node whose Alloy never lands ships
      # no logs at all — silently. See ../priorityclass-node-agent.yaml.
      priorityClassName: lit-node-agent

    alloy:
      # Alloy defaults to also exposing a clustering/UI service; neither is
      # needed for a plain log shipper and the UI would be another thing to
      # think about exposing.
      clustering:
        enabled: false

      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi

      # The Kubernetes API tells each Alloy which pods live on its own node.
      # HOSTNAME is the Alloy pod's own name, which is NOT the node name, so the
      # node name has to be projected in explicitly.
      extraEnv:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName

      configMap:
        content: |-
          // Only this node's pods. Without the field selector every Alloy in the
          // DaemonSet would ship every pod's logs and Loki would receive N
          // duplicate copies on an N-node cluster.
          discovery.kubernetes "pods" {
            role = "pod"

            selectors {
              role  = "pod"
              field = "spec.nodeName=" + sys.env("NODE_NAME")
            }
          }

          // Promote the Kubernetes metadata to Loki labels. Keep this set small
          // and bounded — every distinct label combination is a separate Loki
          // stream, and high-cardinality labels (pod name, uid) are what make a
          // small Loki fall over.
          discovery.relabel "pod_logs" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }

            // The utro workloads label themselves `app: utr-staging-<service>`.
            // Exposing it as service_name is what lets the ported dashboards and
            // the Loki -> Tempo trace correlation work unchanged: Tempo's
            // tracesToLogsV2 maps the OTel service.name onto this label.
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app"]
              target_label  = "service_name"
            }

            // node_name, not node: the ported utro-error-logs dashboard groups
            // by exactly this label name.
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node_name"
            }
          }

          // Reads through the Kubernetes API rather than tailing /var/log/pods,
          // so Alloy needs no hostPath mount and no privileged securityContext.
          loki.source.kubernetes "pod_logs" {
            targets    = discovery.relabel.pod_logs.output
            forward_to = [loki.process.levels.receiver]
          }

          // Extracts the log level for the utro services, which log ECS via
          // go.elastic.co/ecszap and so put it under the flat, dotted key
          // "log.level".
          //
          // Loki would otherwise derive `detected_level` itself
          // (limits_config.discover_log_levels, on by default), but its
          // discovery only inspects a fixed allowlist of TOP-LEVEL JSON keys —
          // level / severity / lvl and case variants. A dotted key matches none
          // of them, so it falls through to a substring scan of the raw line,
          // where any query selecting the `payment_link.error_message` column
          // reads as an error. That silently inflated the utro-error-logs
          // dashboard with DEBUG-level SQL traces.
          //
          // Loki skips its own discovery when the push already carries a level,
          // so this wins without disabling discover_log_levels — lines this
          // stage can't parse (infra components, Alloy's own logfmt) keep the
          // built-in behaviour.
          loki.process "levels" {
            forward_to = [loki.write.default.receiver]

            // The guard matters: stage.template CREATES its source key when the
            // key is absent, so running these stages unconditionally would stamp
            // an empty detected_level on every non-ECS line — infra components,
            // Alloy's own logfmt — and an empty level is worse than none, since
            // it also suppresses Loki's own discovery. `|=` is a literal
            // substring match, so the dot needs no regex escaping. namespace is
            // set by discovery.relabel above for every target, whereas
            // service_name is empty for pods without an `app` label.
            stage.match {
              selector = "{namespace=~\".+\"} |= \"log.level\""

              // JMESPath: a key containing a dot has to be quoted, or it parses
              // as a nested `level` under `log`.
              stage.json {
                expressions = { level = "\"log.level\"" }
              }

              // ecszap emits CAPITALS; Loki's own detected_level values are
              // lowercase, and the dashboard filters on the lowercase form.
              //
              // The backtick wrapper is load-bearing. The chart renders
              // configMap.content through Helm's `tpl`, so Go template syntax
              // anywhere in this block is evaluated by HELM first, and ToLower is
              // an Alloy template function that Helm/sprig does not have.
              // Unescaped, the release fails to render at all with
              //
              //   function "ToLower" not defined
              //
              // and because that is a templating error rather than a runtime one,
              // it takes down the whole HelmRelease, not just this stage.
              // Wrapping the expression in backticks makes Helm emit the inner
              // text verbatim, so Alloy receives the directive intact and
              // evaluates it itself at ingest time.
              //
              // Note "anywhere in this block" includes comments: Helm sees the
              // raw string, not Alloy syntax, so a doubled curly brace in a
              // comment here is a live template call and will break the render.
              stage.template {
                source   = "level"
                template = "{{ `{{ ToLower .Value }}` }}"
              }

              // Structured metadata, not a Loki LABEL: a label would multiply
              // the stream count for no query benefit, and `detected_level` is
              // already what the dashboards filter on.
              stage.structured_metadata {
                values = { detected_level = "level" }
              }
            }
          }

          loki.write "default" {
            endpoint {
              url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
            }
          }

          // Alloy's own metrics, scraped by the ServiceMonitor below.
          logging {
            level  = "info"
            format = "logfmt"
          }

    serviceMonitor:
      enabled: true
