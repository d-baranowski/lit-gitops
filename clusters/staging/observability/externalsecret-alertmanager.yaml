# Alertmanager's delivery credentials: the Slack incoming-webhook URL and the
# SES SMTP password.
#
# Both are written to Secrets Manager by Terraform
# (infrastructure/environments/staging/ses-alerting.tf). The SMTP password is
# derived from an IAM access key and never handled by a human; the Slack webhook
# is the estate's one hand-minted alerting credential — see
# infrastructure/scripts/create-slack-webhook.sh for why Terraform cannot mint
# it.
#
# THIS FILE MUST LIVE HERE, NOT IN ./resources — the Alertmanager pod MOUNTS
# this Secret, so a missing Secret leaves it stuck in ContainerCreating, which
# fails the kube-prometheus-stack HelmRelease, which fails the `observability`
# Kustomization. Since `observability-resources` dependsOn `observability`, the
# Secret would never be created and the two would deadlock permanently. Keeping
# it in the same Kustomization as the release means both are applied in one
# batch. (The ExternalSecret CRD is available here because `observability`
# already dependsOn external-secrets-resources.)
#
# The prometheus-operator mounts this Secret into the Alertmanager pod via
# `alertmanager.alertmanagerSpec.secrets` in the kube-prometheus-stack
# HelmRelease, at:
#   /etc/alertmanager/secrets/alertmanager-receivers/<key>
# The config then references those paths with slack_api_url_file and
# smtp_auth_password_file.
#
# WHY FILES AND NOT ENV VARS: Alertmanager performs no environment-variable
# expansion in its config — `slack_api_url: '$SLACK_WEBHOOK_URL'` is read
# literally and fails with `unsupported scheme ""` even when the variable is
# set. Upstream's answer is the `_file` suffix family. Files are also better
# under rotation: ESO refreshes this Secret hourly and the kubelet projects the
# change into the mounted volume, so a rotated credential is picked up on the
# next config reload without restarting the pod.
#
# NOTE the split: smtp_username is NOT here, but it is no longer inline in the
# HelmRelease either. Alertmanager still has no `smtp_auth_username_file`, so the
# username cannot be delivered as a mounted file like the two values above. It is
# injected into the config itself by externalsecret-alertmanager-config.yaml,
# which renders the whole alertmanager.yaml from this same Secrets Manager entry.
#
# Both files therefore read lit/staging/alerting; this one supplies the values
# Alertmanager can load from disk, the other supplies the one it cannot.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-receivers
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: alertmanager-receivers
    creationPolicy: Owner
    # Retain: a transient Secrets Manager failure must not delete the Secret out
    # from under a running Alertmanager. Losing these files silently disables
    # alert delivery — the one failure this stack cannot afford, because nothing
    # would report it.
    deletionPolicy: Retain
  data:
    - secretKey: slack_webhook_url
      remoteRef:
        key: lit/staging/alerting
        property: slack_webhook_url
    - secretKey: smtp_password
      remoteRef:
        key: lit/staging/alerting
        property: smtp_password
