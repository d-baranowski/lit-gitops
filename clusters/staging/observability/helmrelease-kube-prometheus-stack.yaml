apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  interval: 5m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "85.0.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    crds: CreateReplace
    timeout: 15m
    # Without this, retries default to 0: one failed install sets
    # `Stalled: RetriesExceeded` and Flux never tries again, even after the
    # cause is fixed in git. Worse, the failed Helm release is left behind, so
    # the next attempt hits "has no deployed releases" and needs a manual
    # `flux delete helmrelease` to clear.
    #
    # With retries, Flux uninstalls between attempts and comes back on its own —
    # which matters here because the realistic failure is transient: this release
    # waits on a DaemonSet that cannot schedule until Cluster Autoscaler has
    # finished adding a node.
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    timeout: 15m
    remediation:
      retries: 3
      # Roll back to the last working release rather than sitting broken.
      strategy: rollback
  values:
    # Short release name: it prefixes every generated object, so the Prometheus
    # Service becomes kps-prometheus.observability.svc — a name hardcoded in the
    # Grafana datasource, Tempo's metricsGenerator remoteWriteUrl and the OTel
    # collector's prometheusremotewrite exporter. Changing it breaks all three.
    fullnameOverride: kps

    # Grafana is managed by grafana-operator (observability/resources), not by
    # this chart. forceDeploy* off so the chart does not lay down ConfigMap
    # datasources/dashboards that would fight the operator's CRs.
    grafana:
      enabled: false
      forceDeployDatasources: false
      forceDeployDashboards: false

    prometheusOperator:
      # Leaves the chart's own kube-webhook-certgen Job to issue the admission
      # webhook's certificate. The upstream alternative wires this to a
      # cert-manager selfsigned ClusterIssuer, but this cluster only has the two
      # ACME issuers — adding a selfsigned one purely for this would make the
      # whole metrics stack depend on cert-manager being healthy for no gain.
      admissionWebhooks:
        certManager:
          enabled: false
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 256Mi

    prometheus:
      prometheusSpec:
        # 7d, against the baseline's 14d. Two t3.medium nodes with a hard pod
        # ceiling is not a lot of cluster, and this is the single biggest lever on
        # both disk and memory. Loki and Tempo keep 14d of the detail in S3, so
        # what is lost is long-range metric resolution, not incident history.
        retention: 7d
        retentionSize: ""

        # Discover ServiceMonitor / PodMonitor / PrometheusRule / Probe from every
        # namespace. Without the NilUsesHelmValues overrides the operator only
        # matches objects carrying this release's labels, which would silently
        # exclude cert-manager's ServiceMonitor in the cert-manager namespace —
        # i.e. the RISKS §1 and §4 alerts would evaluate against no data.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        serviceMonitorNamespaceSelector: {}
        podMonitorNamespaceSelector: {}
        ruleNamespaceSelector: {}
        probeNamespaceSelector: {}

        # Tempo's metrics-generator pushes service-graph and span metrics in via
        # /api/v1/write. This field maps to --web.enable-remote-write-receiver;
        # `enableFeatures: [remote-write-receiver]` does NOT — it is a separate
        # feature-flag mechanism and does not open the HTTP endpoint.
        enableRemoteWriteReceiver: true

        resources:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            memory: 2Gi

        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              storageClassName: gp3
              resources:
                requests:
                  storage: 20Gi

    alertmanager:
      enabled: true
      alertmanagerSpec:
        retention: 240h
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 128Mi
        storage:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              storageClassName: gp3
              resources:
                requests:
                  storage: 2Gi
        # Mounts the ExternalSecret at
        #   /etc/alertmanager/secrets/alertmanager-receivers/<key>
        # referenced below by slack_api_url_file and smtp_auth_password_file.
        # The Secret is created in THIS Kustomization (externalsecret-alertmanager.yaml)
        # — the pod will not start without it, so it cannot live in ./resources.
        secrets:
          - alertmanager-receivers

      # Replaces the chart's default config WHOLESALE. Everything the default
      # provided has to be reproduced here — see the Watchdog route and the four
      # inhibit_rules below, both of which are load-bearing.
      config:
        global:
          resolve_timeout: 5m

          # Amazon SES. Provisioned in infrastructure/environments/staging/ses-alerting.tf,
          # which also writes the DKIM and MAIL FROM records into Cloudflare, so
          # the domain self-verifies.
          smtp_smarthost: email-smtp.eu-central-1.amazonaws.com:587
          smtp_from: alerts@inspi.cloud
          # The SES SMTP username, which is an IAM access key id. Inline because
          # Alertmanager has NO `smtp_auth_username_file` (verified: it rejects
          # the field as unknown) — only the password has a file variant. AWS
          # documents an access key id as an identifier rather than a secret, and
          # the sensitive half stays in the mounted file below.
          #
          # Rotating the SES credential changes this value, so it needs a commit.
          # Get it from: terraform -chdir=environments/staging output ses_smtp_username
          smtp_auth_username: AKIA_ROTATED_AND_REMOVED
          smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-receivers/smtp_password
          smtp_require_tls: true

          # Slack. Alertmanager accepts only incoming-webhook URLs here — it
          # rejects bot tokens — which is why this credential is minted by hand
          # (scripts/create-slack-webhook.sh) rather than by Terraform.
          slack_api_url_file: /etc/alertmanager/secrets/alertmanager-receivers/slack_webhook_url

        # Carried over verbatim from the chart default. Without these, a single
        # incident delivers its critical, warning AND info alerts as separate
        # messages — e.g. a node filling up fires PodPendingTooLong,
        # PodDensityCeilingNear and the stock kubernetes-resources alerts at once.
        inhibit_rules:
          - source_matchers: [severity = critical]
            target_matchers: [severity =~ warning|info]
            equal: [namespace, alertname]
          - source_matchers: [severity = warning]
            target_matchers: [severity = info]
            equal: [namespace, alertname]
          - source_matchers: [alertname = InfoInhibitor]
            target_matchers: [severity = info]
            equal: [namespace]
          - target_matchers: [alertname = InfoInhibitor]

        route:
          # Everything goes to both channels. Grouping is what keeps that
          # tolerable: one message per (alert, namespace, severity) rather than
          # one per firing instance, so a NAT outage taking out several
          # certificates produces one notification, not forty.
          group_by: [alertname, namespace, severity]
          group_wait: 30s
          group_interval: 5m
          # A still-firing alert re-notifies twice a day. Shorter turns Slack
          # into noise; longer and a problem you scrolled past disappears.
          repeat_interval: 12h
          receiver: lit-all

          routes:
            # Watchdog is the always-firing heartbeat kube-prometheus-stack ships
            # to prove the pipeline works end to end. It MUST stay routed to
            # "null" — the chart default does this, and losing it means being
            # paged every 12 hours forever.
            - matchers: [alertname = "Watchdog"]
              receiver: "null"

        receivers:
          - name: "null"

          - name: lit-all
            slack_configs:
              - channel: "#alerts"
                send_resolved: true
                title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}'
                text: |-
                  {{ range .Alerts -}}
                  *{{ .Labels.severity | toUpper }}* — {{ .Annotations.summary }}
                  {{ .Annotations.description }}
                  {{ if .Annotations.runbook }}Runbook: `{{ .Annotations.runbook }}`{{ end }}
                  {{ end }}
            email_configs:
              # SES is in the sandbox, so this address must be a verified SES
              # identity (aws_ses_email_identity in ses-alerting.tf). Adding a
              # second recipient requires SES production access.
              - to: daniel.m.baranowski@gmail.com
                send_resolved: true
                headers:
                  Subject: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .Alerts | len }})'
                html: |-
                  {{ range .Alerts }}
                  <p><b>{{ .Labels.severity | toUpper }} — {{ .Annotations.summary }}</b></p>
                  <p>{{ .Annotations.description }}</p>
                  {{ if .Annotations.runbook }}<p>Runbook: {{ .Annotations.runbook }}</p>{{ end }}
                  <hr>
                  {{ end }}

    # The chart ships both of these with EMPTY resource blocks, which makes them
    # BestEffort — first in line for eviction under node memory pressure. On a
    # cluster this size that is a real risk, and losing them is the worst thing
    # to lose quietly: kube-state-metrics backs the pod/deployment/node alerts
    # (including PodPendingTooLong and PodDensityCeilingNear) and node-exporter
    # backs every host dashboard. Small explicit requests make them Burstable.
    kube-state-metrics:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
    nodeExporter:
      enabled: true
    prometheus-node-exporter:
      # Without this the DaemonSet cannot place a pod on a node that is already
      # at the 17-pod VPC CNI ceiling: at priority 0 it has nothing to preempt,
      # and Cluster Autoscaler ignores unschedulable DaemonSet pods. That is what
      # stalled the first install of this release for the full 15m timeout.
      # See ../priorityclass-node-agent.yaml.
      priorityClassName: lit-node-agent
      hostRootFsMount:
        enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi

    # EKS control-plane adaptation. On a managed control plane the scheduler,
    # controller-manager and etcd have no scrapeable endpoint — leaving them on
    # produces three permanently-down targets and their bundled alerts fire
    # forever. kube-proxy DOES run as a DaemonSet on the nodes, so it stays.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: true
