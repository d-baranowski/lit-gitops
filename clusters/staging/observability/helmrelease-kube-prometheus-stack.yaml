apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  interval: 5m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "85.0.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    crds: CreateReplace
    timeout: 15m
    # Without this, retries default to 0: one failed install sets
    # `Stalled: RetriesExceeded` and Flux never tries again, even after the
    # cause is fixed in git. Worse, the failed Helm release is left behind, so
    # the next attempt hits "has no deployed releases" and needs a manual
    # `flux delete helmrelease` to clear.
    #
    # With retries, Flux uninstalls between attempts and comes back on its own —
    # which matters here because the realistic failure is transient: this release
    # waits on a DaemonSet that cannot schedule until Cluster Autoscaler has
    # finished adding a node.
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    timeout: 15m
    remediation:
      retries: 3
      # Roll back to the last working release rather than sitting broken.
      strategy: rollback
      # Rollback BETWEEN retries is fine — it restores a working release while
      # the next attempt runs. Rolling back after the LAST retry is not: it
      # reverts the very change that was meant to fix the failure, so a fix that
      # is itself a config or resource change can never land. The release then
      # sits failed on the old config with no retries left.
      remediateLastFailure: false
  values:
    # Short release name: it prefixes every generated object, so the Prometheus
    # Service becomes kps-prometheus.observability.svc — a name hardcoded in the
    # Grafana datasource, Tempo's metricsGenerator remoteWriteUrl and the OTel
    # collector's prometheusremotewrite exporter. Changing it breaks all three.
    fullnameOverride: kps

    # Grafana is managed by grafana-operator (observability/resources), not by
    # this chart. forceDeploy* off so the chart does not lay down ConfigMap
    # datasources/dashboards that would fight the operator's CRs.
    grafana:
      enabled: false
      forceDeployDatasources: false
      forceDeployDashboards: false

    prometheusOperator:
      # Leaves the chart's own kube-webhook-certgen Job to issue the admission
      # webhook's certificate. The upstream alternative wires this to a
      # cert-manager selfsigned ClusterIssuer, but this cluster only has the two
      # ACME issuers — adding a selfsigned one purely for this would make the
      # whole metrics stack depend on cert-manager being healthy for no gain.
      admissionWebhooks:
        certManager:
          enabled: false
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 256Mi

    prometheus:
      prometheusSpec:
        # 7d, against the baseline's 14d. Two t3.medium nodes with a hard pod
        # ceiling is not a lot of cluster, and this is the single biggest lever on
        # both disk and memory. Loki and Tempo keep 14d of the detail in S3, so
        # what is lost is long-range metric resolution, not incident history.
        retention: 7d
        retentionSize: ""

        # Discover ServiceMonitor / PodMonitor / PrometheusRule / Probe from every
        # namespace. Without the NilUsesHelmValues overrides the operator only
        # matches objects carrying this release's labels, which would silently
        # exclude cert-manager's ServiceMonitor in the cert-manager namespace —
        # i.e. the RISKS §1 and §4 alerts would evaluate against no data.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        serviceMonitorNamespaceSelector: {}
        podMonitorNamespaceSelector: {}
        ruleNamespaceSelector: {}
        probeNamespaceSelector: {}

        # Tempo's metrics-generator pushes service-graph and span metrics in via
        # /api/v1/write. This field maps to --web.enable-remote-write-receiver;
        # `enableFeatures: [remote-write-receiver]` does NOT — it is a separate
        # feature-flag mechanism and does not open the HTTP endpoint.
        enableRemoteWriteReceiver: true

        resources:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            memory: 2Gi

        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              storageClassName: gp3
              resources:
                requests:
                  storage: 20Gi

    alertmanager:
      enabled: true
      alertmanagerSpec:
        retention: 240h
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 128Mi
        storage:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              storageClassName: gp3
              resources:
                requests:
                  storage: 2Gi
        # Mounts the ExternalSecret at
        #   /etc/alertmanager/secrets/alertmanager-receivers/<key>
        # referenced by slack_api_url_file and smtp_auth_password_file in the
        # config. The Secret is created in THIS Kustomization
        # (externalsecret-alertmanager.yaml) — the pod will not start without it,
        # so it cannot live in ./resources.
        secrets:
          - alertmanager-receivers

        # The whole Alertmanager config comes from this Secret rather than from
        # a `config:` block here, because smtp_auth_username must be injected
        # from Secrets Manager and Alertmanager has no smtp_auth_username_file.
        # Rendered by externalsecret-alertmanager-config.yaml in this same
        # Kustomization — read its header before touching either file, the
        # missing-Secret failure mode is silent.
        configSecret: alertmanager-config

    # The chart ships both of these with EMPTY resource blocks, which makes them
    # BestEffort — first in line for eviction under node memory pressure. On a
    # cluster this size that is a real risk, and losing them is the worst thing
    # to lose quietly: kube-state-metrics backs the pod/deployment/node alerts
    # (including PodPendingTooLong and PodDensityCeilingNear) and node-exporter
    # backs every host dashboard. Small explicit requests make them Burstable.
    kube-state-metrics:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi

      # --- Flux delivery health -------------------------------------------
      #
      # Flux's controllers expose only gotk_reconcile_duration_seconds and some
      # cache counters. There is NO gotk_reconcile_condition — it was removed,
      # and upstream's monitoring docs now point here instead: kube-state-metrics
      # reading the CR status conditions directly. Alerting on the old metric
      # name would have been silently never-firing.
      #
      # This is what closes the gap Flux events cannot: an Alert only fires on an
      # EVENT, so a resource that is stalled or suspended rather than actively
      # failing produces nothing at all. A suspended ImageUpdateAutomation is the
      # concrete case — suspend it and deployment stops with no error anywhere.
      #
      # DELIBERATELY OMITTED from upstream's example config: `collectors: []` and
      # `--custom-resource-state-only=true`. Both are in fluxcd's snippet and both
      # would disable every standard collector — taking out
      # kube_deployment_status_replicas_unavailable (UtroDeploymentDegraded),
      # PodPendingTooLong, PodDensityCeilingNear and the whole kubernetes-apps
      # rule group. Upstream's own comment says to drop them when adding to an
      # existing stack. Adding custom resources must not remove the built-ins.
      rbac:
        extraRules:
          - apiGroups:
              - kustomize.toolkit.fluxcd.io
              - helm.toolkit.fluxcd.io
              - source.toolkit.fluxcd.io
              - image.toolkit.fluxcd.io
            resources:
              - kustomizations
              - helmreleases
              - gitrepositories
              - imagerepositories
              - imagepolicies
              - imageupdateautomations
            verbs: ["list", "watch"]

      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              # Group/version must match what this cluster serves — v1 for
              # kustomize/source/image, v2 for helm. A wrong version yields no
              # metric and no error.
              - groupVersionKind:
                  group: kustomize.toolkit.fluxcd.io
                  version: v1
                  kind: Kustomization
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Kustomization resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, lastAppliedRevision]
              - groupVersionKind:
                  group: helm.toolkit.fluxcd.io
                  version: v2
                  kind: HelmRelease
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux HelmRelease resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: GitRepository
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux GitRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
              # The three below are the delivery path this estate actually
              # depends on: ECR scan -> semver policy -> commit. A stall in any
              # of them stops deployment silently.
              - groupVersionKind:
                  group: image.toolkit.fluxcd.io
                  version: v1
                  kind: ImageRepository
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux ImageRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
              - groupVersionKind:
                  group: image.toolkit.fluxcd.io
                  version: v1
                  kind: ImagePolicy
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux ImagePolicy resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
              - groupVersionKind:
                  group: image.toolkit.fluxcd.io
                  version: v1
                  kind: ImageUpdateAutomation
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux ImageUpdateAutomation resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
    nodeExporter:
      enabled: true
    prometheus-node-exporter:
      # Without this the DaemonSet cannot place a pod on a node that is already
      # at the 17-pod VPC CNI ceiling: at priority 0 it has nothing to preempt,
      # and Cluster Autoscaler ignores unschedulable DaemonSet pods. That is what
      # stalled the first install of this release for the full 15m timeout.
      # See ../priorityclass-node-agent.yaml.
      priorityClassName: lit-node-agent
      hostRootFsMount:
        enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi

    # EKS control-plane adaptation. On a managed control plane the scheduler,
    # controller-manager and etcd have no scrapeable endpoint — leaving them on
    # produces three permanently-down targets and their bundled alerts fire
    # forever. kube-proxy DOES run as a DaemonSet on the nodes, so it stays.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: true
