# Grafana, deployed by grafana-operator from this CR (not by the Helm chart —
# kube-prometheus-stack has grafana.enabled: false).
#
# Reachable ONLY through Cloudflare Access: a cloudflared Deployment
# (clusters/staging/cloudflared) dials out to Cloudflare, and the tunnel's
# ingress rule — managed remotely by Terraform — forwards to grafana-service:3000.
# There is no Ingress, no HTTPRoute, no listener on the utro Gateway and no
# public LoadBalancer for Grafana.
#
# Auto-login is the same trick Jenkins uses (see jenkins.yaml.j2's jwtAuth realm):
# Cloudflare Access authenticates the person and injects a SIGNED assertion in the
# Cf-Access-Jwt-Assertion header; Grafana verifies that signature against
# Cloudflare's JWKS and checks the issuer and audience. It is not a trusted-header
# scheme — an attacker who reached the pod directly could not forge one.
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: observability
  labels:
    # GrafanaDashboard / GrafanaDatasource / GrafanaFolder CRs select this
    # instance by this label.
    dashboards: "grafana"
spec:
  config:
    log:
      mode: "console"

    server:
      root_url: "https://grafana-staging.inspi.cloud"
      serve_from_sub_path: "false"

    auth:
      # BREAK-GLASS, deliberately left enabled. If the AUD is wrong, the
      # ExternalSecret has not synced, or Cloudflare is down, JWT verification
      # simply fails and Grafana falls back to this form — reachable from the
      # bastion with:
      #   kubectl -n observability port-forward svc/grafana-service 3000:3000
      # The password is generated by the operator into grafana-admin-credentials.
      #
      # This is the GitOps equivalent of the Jinja `{% if team and aud %}` guard
      # in the Jenkins JCasC template. Grafana differs from Jenkins in that a bad
      # auth config cannot stop it booting, so the fallback only has to be a
      # working login path, not a whole alternate realm.
      disable_login_form: "false"
      # Nothing should be readable without authenticating.
      disable_signout_menu: "false"

    "auth.anonymous":
      enabled: "false"

    "auth.jwt":
      enabled: "true"
      # The header Cloudflare Access injects on every proxied request.
      header_name: "Cf-Access-Jwt-Assertion"
      # Access tokens carry the verified identity in `email`; there is no
      # separate username claim.
      username_claim: "email"
      email_claim: "email"
      # First login creates the Grafana user. Cloudflare has already decided who
      # is allowed through (the Access policy allows exactly one address), so
      # this does not widen access — it only avoids pre-creating the account.
      auto_sign_up: "true"
      # Off: this is header-based SSO, not an OAuth redirect flow. Leaving it on
      # makes Grafana try to treat a URL parameter as a token.
      url_login: "false"
      jwk_set_url: "https://inspiration-particle.cloudflareaccess.com/cdn-cgi/access/certs"
      cache_ttl: "60m"
      # A JMESPath expression, not a plain value — the inner single quotes make
      # it a string literal within the expression, which is how a constant role
      # is spelled.
      #
      # GrafanaAdmin, not Admin. `Admin` is only *organisation* admin: full
      # control of dashboards, datasources, users and alerting within the org,
      # but no access to Server Admin — no user administration across orgs, no
      # org management, no server settings or stats page.
      # `GrafanaAdmin` grants the server-admin flag AND org Admin on top.
      #
      # Requires allow_assign_grafana_admin below; without it Grafana silently
      # downgrades the mapping to org Admin and the Server Admin menu never
      # appears.
      #
      # Safe here because Cloudflare Access is the real gate and its policy
      # allows exactly one address — anyone who reaches Grafana at all has
      # already been authorised as that person.
      role_attribute_path: "'GrafanaAdmin'"
      allow_assign_grafana_admin: "true"
      # expect_claims (issuer + audience) is NOT set here. It contains the Access
      # application's AUD tag, which does not exist until Terraform has applied,
      # so it arrives at runtime as GF_AUTH_JWT_EXPECT_CLAIMS via the envFrom
      # below. Without it Grafana would accept any validly-signed Cloudflare JWT
      # from this account, including one minted for a different Access app.

    users:
      # Accounts come from Access, never self-service.
      allow_sign_up: "false"
      allow_org_create: "false"

    security:
      allow_embedding: "false"
      cookie_secure: "true"

  deployment:
    spec:
      replicas: 1
      template:
        spec:
          containers:
            - name: grafana
              # GF_AUTH_JWT_EXPECT_CLAIMS, sourced from Secrets Manager via ESO.
              # Grafana maps GF_<SECTION>_<KEY> onto grafana.ini, and the value
              # is a JSON string, which survives an env var intact.
              #
              # The operator merges a partial container spec by name, so this
              # does not replace the image/probes/volumes it manages.
              envFrom:
                - secretRef:
                    name: grafana-access-jwt
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 512Mi

  service:
    spec:
      type: ClusterIP
      ports:
        - name: http
          port: 3000
          targetPort: 3000

  persistentVolumeClaim:
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: gp3
      resources:
        requests:
          storage: 5Gi
