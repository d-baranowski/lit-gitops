# The Cloudflare Access audience tag, shaped as a Grafana env var.
#
# Jenkins solves this problem with an Ansible extra-var: bootstrap-jenkins.sh
# reads `terraform output jenkins_access_aud` and passes it into the JCasC
# template. GitOps has no such step — Flux applies static YAML — so the AUD
# travels through Secrets Manager instead, written there by
# infrastructure/environments/staging/cloudflare-grafana.tf, and ESO templates it
# into the exact env var Grafana expects.
#
# Why it matters: without expect_claims Grafana would accept ANY validly-signed
# JWT from this Cloudflare account, including one minted for a different Access
# application. Pinning both the issuer and the audience is what makes the token
# specific to this Grafana.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-access-jwt
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: grafana-access-jwt
    creationPolicy: Owner
    # Retain, not Delete. If Secrets Manager is briefly unreachable or the secret
    # is rotated badly, the running Grafana keeps the env var it already has
    # rather than losing its auth config mid-flight.
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # Grafana maps GF_<SECTION>_<KEY> onto grafana.ini, so this becomes
        # [auth.jwt] expect_claims. The value is a JSON object as a string.
        GF_AUTH_JWT_EXPECT_CLAIMS: '{"iss":"{{ .team_domain }}","aud":"{{ .access_aud }}"}'
  data:
    - secretKey: access_aud
      remoteRef:
        key: lit/staging/grafana
        property: access_aud
    - secretKey: team_domain
      remoteRef:
        key: lit/staging/grafana
        property: team_domain
