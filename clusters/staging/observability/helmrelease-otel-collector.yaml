apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-collector
  namespace: observability
spec:
  interval: 5m
  chart:
    spec:
      chart: opentelemetry-collector
      version: "0.153.0"
      sourceRef:
        kind: HelmRepository
        name: opentelemetry
        namespace: flux-system
  install:
    timeout: 10m
    # See helmrelease-kube-prometheus-stack.yaml: without retries a single failed
    # install stalls permanently and leaves a failed Helm release behind.
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
      strategy: rollback
  values:
    # This name is load-bearing. Every utro Deployment already ships
    #   TR_ENDPOINT: otel-collector.observability.svc.cluster.local:4318
    # (clusters/staging/utro/*-deployment.yaml) and has been exporting into the
    # void since the app landed. fullnameOverride is what makes the Service
    # resolve at exactly that name, so tracing starts working with no app change.
    fullnameOverride: otel-collector
    mode: deployment
    replicaCount: 1

    # The contrib distribution — the core image does not ship the
    # prometheusremotewrite exporter used below.
    image:
      repository: otel/opentelemetry-collector-contrib

    # The chart's presets would add log collection, k8s attribute enrichment and
    # host metrics. Logs come from Alloy and host metrics from node-exporter, so
    # all three would only duplicate data. The full config is authored below.
    presets:
      logsCollection:
        enabled: false
      kubernetesAttributes:
        enabled: false
      hostMetrics:
        enabled: false

    ports:
      otlp:
        enabled: true
        containerPort: 4317
        servicePort: 4317
        protocol: TCP
      otlp-http:
        enabled: true
        containerPort: 4318
        servicePort: 4318
        protocol: TCP
      jaeger-compact:
        enabled: false
      jaeger-thrift:
        enabled: false
      jaeger-grpc:
        enabled: false
      zipkin:
        enabled: false
      metrics:
        enabled: false

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi

    serviceMonitor:
      enabled: true

    # A fan-out router, not a storage tier. Apps push one OTLP stream carrying
    # both traces and metrics; this splits it, because Tempo's OTLP endpoint
    # accepts traces only and returns 404 on /v1/metrics.
    config:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

      processors:
        batch:
          timeout: 5s
          send_batch_size: 1024
        memory_limiter:
          check_interval: 1s
          limit_percentage: 80
          spike_limit_percentage: 25

      # WHY EVERY EXPORTER BELOW CARRIES AN EXPLICIT sending_queue
      #
      # On 2026-08-03 Tempo OOMed under a k6 run and entered a crash loop. This
      # collector then OOMed too — seven times — and took METRICS down with it,
      # even though Prometheus was perfectly healthy. Traces and metrics share one
      # process and one memory limit, so a trace-backend outage became a total
      # telemetry outage.
      #
      # The default queue is not the safeguard it looks like. queue_size defaults
      # to 1000 with sizer "requests", i.e. 1000 BATCHES — and send_batch_size
      # above is 1024, so the ceiling is ~1,000,000 spans. That cannot fit in the
      # 512Mi limit, so the container is OOMKilled long before the queue ever
      # considers itself full. The pre-crash logs show exactly that: memory
      # climbing 351 -> 444 MiB with "above hard limit, forcing a GC" while the
      # exporter retried against a dead Tempo.
      #
      # So the ceiling is restated in a unit that can be checked against the
      # memory limit, and every exporter gets its own — that independence is what
      # keeps a Tempo failure from touching metrics.
      exporters:
        otlp/tempo:
          endpoint: tempo.observability.svc.cluster.local:4317
          tls:
            insecure: true
          sending_queue:
            enabled: true
            # sizer: items counts SPANS. The default "requests" counts batches,
            # which cannot be reasoned about against a memory limit at all.
            sizer: items
            # ~50-100 MiB of spans — comfortably inside 512Mi alongside the
            # metrics queue and the collector's own overhead.
            queue_size: 50000
            num_consumers: 10
            # MUST stay false. Blocking would apply backpressure through the OTLP
            # receiver into the application's own export calls, turning a
            # telemetry outage into application latency. Dropping spans is
            # strictly the better failure.
            block_on_overflow: false
          retry_on_failure:
            enabled: true
            # 60s, not the 300s default: five minutes of retrying against a dead
            # backend is five minutes of filling the queue.
            max_elapsed_time: 60s
        prometheusremotewrite:
          endpoint: http://kps-prometheus.observability.svc.cluster.local:9090/api/v1/write
          # Turns OTel resource attributes (service.name, deployment.environment)
          # into Prometheus labels. Without it every series arrives unattributed
          # and the per-service dashboard panels have nothing to group by.
          resource_to_telemetry_conversion:
            enabled: true
          # Metrics get their own bounded queue for the same reason, sized
          # smaller: data points are cheaper than spans and Prometheus is the
          # backend that must not be starved when traces misbehave.
          sending_queue:
            enabled: true
            sizer: items
            queue_size: 20000
            num_consumers: 5
            block_on_overflow: false
          retry_on_failure:
            enabled: true
            max_elapsed_time: 60s

      service:
        pipelines:
          traces:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [otlp/tempo]
          metrics:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [prometheusremotewrite]
          # No logs pipeline: Alloy ships container stdout to Loki directly.
        telemetry:
          logs:
            level: info
