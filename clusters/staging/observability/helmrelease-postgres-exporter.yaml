apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres-exporter
  namespace: observability
spec:
  interval: 5m
  chart:
    spec:
      chart: prometheus-postgres-exporter
      version: "8.2.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
      strategy: rollback
      # Rollback BETWEEN retries is fine — it restores a working release while
      # the next attempt runs. Rolling back after the LAST retry is not: it
      # reverts the very change that was meant to fix the failure, so a fix that
      # is itself a config or resource change can never land. The release then
      # sits failed on the old config with no retries left.
      remediateLastFailure: false
  values:
    # Exists because of the 2026-07-29 outage: a connection-pool self-deadlock in
    # utro's core service left 50 sessions `idle in transaction` and wedged
    # login for hours, and NOTHING saw it. There was no database observability of
    # any kind — no exporter, no RDS alarms, no pg_stat_activity anywhere — so
    # the only way to find it was to open psql by hand.
    #
    # The alerts that consume this live in
    # observability/resources/prometheusrule-lit-risks.yaml (group lit.postgres).
    fullnameOverride: postgres-exporter

    config:
      # Connection string comes from the ExternalSecret in this directory, which
      # uses the pg_monitor-granted `exporter` role. See that file for why the
      # role matters.
      datasourceSecret:
        name: postgres-exporter
        key: DATA_SOURCE_NAME

      # Aurora forbids some collectors that assume a self-managed server. The
      # replication collector is one: it calls pg_last_xact_replay_timestamp()
      # on every scrape, which Aurora rejects outright, so it failed every 30s
      # with
      #   pq: Function pg_last_xact_replay_timestamp() is currently not
      #   supported for Aurora
      # filling the pod log and never producing the metric anyway.
      #
      # The chart has disableCollectorDatabase/Bgwriter toggles but none for
      # replication, so it goes through extraArgs. Flag verified against the
      # running binary (--[no-]collector.replication) rather than assumed —
      # postgres_exporter exits on an unknown flag, which would turn a noisy
      # exporter into a CrashLoopBackOff.
      #
      # Nothing is lost by dropping it: replication lag on a managed Aurora
      # cluster is CloudWatch's to report, not this exporter's.
      extraArgs:
        - --no-collector.replication

      disableDefaultMetrics: false
      # Per-database stats. This cluster has one database, so the cardinality
      # cost is negligible.
      disableSettingsMetrics: false

      # pg_stat_activity by state is THE metric for this incident class: it is
      # what makes `idle in transaction` countable and therefore alertable.
      autoDiscoverDatabases: false

    serviceMonitor:
      enabled: true
      interval: 30s

    # One replica. The exporter is stateless and its own unavailability is
    # covered by Prometheus' `up` metric; two would just double the connections
    # held against a database that is already the scarce resource.
    replicaCount: 1

    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi

    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
