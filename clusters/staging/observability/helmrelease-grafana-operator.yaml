apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-operator
  namespace: observability
spec:
  interval: 5m
  chart:
    spec:
      chart: grafana-operator
      version: "5.22.2"
      sourceRef:
        kind: HelmRepository
        name: grafana-operator
        namespace: flux-system
  install:
    crds: CreateReplace
    timeout: 10m
    # See helmrelease-kube-prometheus-stack.yaml: without retries a single failed
    # install stalls permanently and leaves a failed Helm release behind.
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    timeout: 10m
    remediation:
      retries: 3
      strategy: rollback
      # Rollback BETWEEN retries is fine — it restores a working release while
      # the next attempt runs. Rolling back after the LAST retry is not: it
      # reverts the very change that was meant to fix the failure, so a fix that
      # is itself a config or resource change can never land. The release then
      # sits failed on the old config with no retries left.
      remediateLastFailure: false
  values:
    # Cluster-scoped watch. Only the observability namespace is used today, but
    # namespaceScope: true bakes the namespace into the operator's RBAC and
    # changing it later means a reinstall.
    namespaceScope: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
