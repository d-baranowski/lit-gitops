apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: observability
spec:
  interval: 5m
  chart:
    spec:
      chart: tempo
      version: "1.24.4"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    timeout: 10m
    # See helmrelease-kube-prometheus-stack.yaml: without retries a single failed
    # install stalls permanently and leaves a failed Helm release behind.
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
      strategy: rollback
  values:
    fullnameOverride: tempo

    # Must match the aws_eks_pod_identity_association for the tempo role in
    # infrastructure/modules/observability — see the note in helmrelease-loki.yaml.
    serviceAccount:
      create: true
      name: tempo

    persistence:
      enabled: true
      size: 10Gi
      storageClassName: gp3

    tempo:
      # 3 days, not the 14 it used to be. Retention drives how many blocks the
      # compactor holds open and replays, and this is a single-pod staging Tempo
      # whose traces exist to debug a load test that ran minutes ago — not to be
      # queried a fortnight later. Loki and Prometheus keep the durable record.
      retention: 72h

      # NOTE: `resources` belongs UNDER `tempo:` in this chart (v1.24.x), not at
      # the top level — the StatefulSet template reads .Values.tempo.resources.
      # A top-level `resources:` block is accepted by the schema and silently
      # ignored, leaving the container with no requests at all: it then schedules
      # anywhere, counts as BestEffort, and is first to be evicted under memory
      # pressure. Same shape of trap as this chart's `extraEnvFrom`.
      #
      # 2Gi, raised from 1Gi after the 2026-08-03 crash loop. A k6 run pushed
      # enough spans to OOM the ingester, and the restart could not recover:
      # replaying the WAL it had just written needed more memory than it had, so
      # every restart OOMed at the same point. The logs are unambiguous — "wal
      # replay complete", "Tempo started", "completing block", then exit 137
      # about eighteen seconds in, seven times over.
      #
      # The headroom is what breaks that loop. Ingest is bursty by nature here:
      # a load test is precisely a spike, so sizing to steady state guarantees
      # this recurs on the next run.
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi

      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

      # Derives RED metrics and a service graph from spans and remote-writes them
      # into Prometheus. This is what powers the traces_service_graph_request_*
      # panels on the utro dashboards — without it those panels are empty even
      # though traces themselves arrive fine.
      metricsGenerator:
        enabled: true
        remoteWriteUrl: "http://kps-prometheus.observability.svc.cluster.local:9090/api/v1/write"

      storage:
        trace:
          backend: s3
          s3:
            bucket: lit-staging-tempo-traces
            endpoint: s3.eu-central-1.amazonaws.com
            region: eu-central-1
            forcepathstyle: false
            # No access_key/secret_key: EKS Pod Identity supplies credentials
            # through the AWS SDK's default provider chain.
          wal:
            path: /var/tempo/wal
          pool:
            max_workers: 100
            queue_depth: 10000

      overrides:
        defaults:
          metrics_generator:
            processors:
              - service-graphs
              - span-metrics

    serviceMonitor:
      enabled: true
