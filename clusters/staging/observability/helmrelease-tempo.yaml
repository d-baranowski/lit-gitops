apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: observability
spec:
  interval: 5m
  chart:
    spec:
      chart: tempo
      version: "1.24.4"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    timeout: 10m
    # See helmrelease-kube-prometheus-stack.yaml: without retries a single failed
    # install stalls permanently and leaves a failed Helm release behind.
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
      strategy: rollback
      # Rollback BETWEEN retries is fine — it restores a working release while
      # the next attempt runs. Rolling back after the LAST retry is not: it
      # reverts the very change that was meant to fix the failure, so a fix that
      # is itself a config or resource change can never land. The release then
      # sits failed on the old config with no retries left.
      remediateLastFailure: false
  values:
    fullnameOverride: tempo

    # Must match the aws_eks_pod_identity_association for the tempo role in
    # infrastructure/modules/observability — see the note in helmrelease-loki.yaml.
    serviceAccount:
      create: true
      name: tempo

    persistence:
      enabled: true
      size: 10Gi
      storageClassName: gp3

    tempo:
      # Retention drives how many blocks the compactor holds open and replays.
      # This is a single-pod staging Tempo whose traces exist to debug a run that
      # happened minutes ago, not a fortnight ago; Loki and Prometheus keep the
      # durable record.
      retention: 72h

      # NOTE: `resources` belongs UNDER `tempo:` in this chart (v1.24.x), not at
      # the top level — the StatefulSet template reads .Values.tempo.resources.
      # A top-level `resources:` block is accepted by the schema and silently
      # ignored, leaving the container with no requests at all: it then schedules
      # anywhere, counts as BestEffort, and is first to be evicted under memory
      # pressure. Same shape of trap as this chart's `extraEnvFrom`.
      #
      # Sized for burst, not steady state. Ingest here is spiky by definition —
      # load tests are the reason this cluster has traces at all — and an OOM is
      # self-perpetuating: the ingester must replay the WAL it just wrote to come
      # back, which costs more memory than writing it did. Too tight a limit
      # turns one spike into a crash loop that cannot exit on its own.
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi

      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

      # Derives RED metrics and a service graph from spans and remote-writes them
      # into Prometheus. This is what powers the traces_service_graph_request_*
      # panels on the utro dashboards — without it those panels are empty even
      # though traces themselves arrive fine.
      metricsGenerator:
        enabled: true
        remoteWriteUrl: "http://kps-prometheus.observability.svc.cluster.local:9090/api/v1/write"

      storage:
        trace:
          backend: s3
          s3:
            bucket: lit-staging-tempo-traces
            endpoint: s3.eu-central-1.amazonaws.com
            region: eu-central-1
            forcepathstyle: false
            # No access_key/secret_key: EKS Pod Identity supplies credentials
            # through the AWS SDK's default provider chain.
          wal:
            path: /var/tempo/wal
          pool:
            max_workers: 100
            queue_depth: 10000

      overrides:
        defaults:
          metrics_generator:
            processors:
              - service-graphs
              - span-metrics

    serviceMonitor:
      enabled: true
