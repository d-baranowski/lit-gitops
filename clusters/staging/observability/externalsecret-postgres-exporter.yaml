# Connection string for prometheus-postgres-exporter.
#
# Uses the dedicated `exporter` role, NOT `app`. The role is created by the
# Ansible db bootstrap with `GRANT pg_monitor` — which is required rather than
# optional: without it a non-privileged role sees other sessions in
# pg_stat_activity with `state` NULL, so the exporter would report a handful of
# connections while the database was actually saturated. A metric that silently
# undercounts is worse than no metric at all.
#
# pg_monitor is read-only (pg_read_all_stats + pg_read_all_settings +
# pg_stat_scan_tables) and grants no access to table data, so this credential
# cannot read application rows even if it leaks.
#
# The secret is generated by Terraform (modules/aurora-postgres provisions one
# per role in var.roles). `url` is the ready-made libpq connection string.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-exporter
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: postgres-exporter
    creationPolicy: Owner
    # Retain: losing this Secret would take the exporter down, and with it the
    # alerts that watch for the incident it exists to catch.
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # The chart reads DATA_SOURCE_NAME when config.datasource is unset.
        # sslmode=require: Aurora terminates TLS and the traffic crosses subnets.
        DATA_SOURCE_NAME: "{{ .url }}?sslmode=require"
  data:
    - secretKey: url
      remoteRef:
        key: lit/staging/postgres/exporter
        property: url
