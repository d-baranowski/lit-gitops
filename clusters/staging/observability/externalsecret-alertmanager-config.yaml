# Alertmanager's ENTIRE configuration, rendered from Secrets Manager.
#
# WHY THE WHOLE CONFIG AND NOT JUST ONE FIELD
#
# The only value here that must not sit in git is smtp_auth_username — the SES
# SMTP username, which is an IAM access key id. Alertmanager has no
# `smtp_auth_username_file` (checked against upstream: the global SMTP options
# expose _file variants for smtp_auth_password and smtp_auth_secret only), so
# there is no way to point that one field at a mounted file the way the password
# and the Slack webhook already do.
#
# Alertmanager reads exactly one config file, so the only place a templated
# username can enter is the file itself. That means the whole config travels
# through this ExternalSecret and is handed to the Alertmanager CR via
# `alertmanagerSpec.configSecret` in the kube-prometheus-stack HelmRelease.
#
# READ THIS BEFORE CHANGING ANYTHING HERE
#
# The operator's contract for configSecret: if this Secret is missing, or is
# present but has no `alertmanager.yaml` key, it does NOT fail loudly. It
# provisions a minimal config with one empty receiver — Alertmanager comes up
# healthy and silently drops every notification.
#
# That is the inverse of the old failure mode (a missing mounted Secret left the
# pod in ContainerCreating, which failed the HelmRelease, which was impossible to
# miss). Silent alert loss is the one outcome this stack cannot tolerate, so two
# things guard it and BOTH must stay:
#
#   1. deletionPolicy: Retain — an ESO or Secrets Manager failure must never
#      delete this Secret out from under a running Alertmanager.
#   2. AlertmanagerConfigNotRendered in ../resources/prometheusrule-lit-risks.yaml
#      — fires if this ExternalSecret stops syncing, which is the only warning
#      that the config is drifting toward the empty-receiver default.
#
# WHY THE NOTIFICATION BODIES ARE IN lit.tmpl AND NOT INLINE
#
# ESO renders this with Go templating, and Alertmanager's notification bodies
# are themselves Go templates. Inline, every one of their ~24 `{{ }}` actions
# would need escaping against ESO, in a config where a mistake loses alerts.
# Instead the bodies live in the `lit.tmpl` key below, wrapped whole in a single
# Go raw-string literal so ESO emits them verbatim. The config then refers to
# them by name, and only those four short references need escaping.
#
# The operator copies every key other than alertmanager.yaml into the generated
# Secret and mounts them at /etc/alertmanager/config/, which is what the
# `templates:` glob picks up.
#
# The password and the Slack webhook are deliberately NOT here. They stay in the
# separate alertmanager-receivers Secret mounted at
# /etc/alertmanager/secrets/alertmanager-receivers/ and are referenced by _file,
# because file-based values are re-read on reload without restarting the pod.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-config
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: alertmanager-config
    creationPolicy: Owner
    # See the header: losing this Secret does not stop Alertmanager, it silently
    # empties it. Retain is load-bearing, not a default.
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m

            # Amazon SES. Provisioned in terraform/environments/staging/ses-alerting.tf,
            # which also writes the DKIM and MAIL FROM records into Cloudflare, so
            # the domain self-verifies.
            smtp_smarthost: email-smtp.eu-central-1.amazonaws.com:587
            smtp_from: alerts@inspi.cloud
            # The SES SMTP username (an IAM access key id), injected from
            # Secrets Manager. Terraform already writes it to lit/staging/alerting
            # as `smtp_username` — see the aws_secretsmanager_secret_version in
            # ses-alerting.tf. Rotating the SES credential no longer needs a
            # commit here; ESO picks the new value up on its next refresh.
            smtp_auth_username: {{ .smtp_username }}
            smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-receivers/smtp_password
            smtp_require_tls: true

            # Slack. Alertmanager accepts only incoming-webhook URLs here — it
            # rejects bot tokens — which is why this credential is minted by hand
            # (scripts/create-slack-webhook.sh) rather than by Terraform.
            slack_api_url_file: /etc/alertmanager/secrets/alertmanager-receivers/slack_webhook_url

          # Named notification bodies, from the lit.tmpl key below. The operator
          # mounts every non-alertmanager.yaml key of this Secret here.
          templates:
            - /etc/alertmanager/config/*.tmpl

          # Carried over verbatim from the chart default. Without these, a single
          # incident delivers its critical, warning AND info alerts as separate
          # messages — e.g. a node filling up fires PodPendingTooLong,
          # PodDensityCeilingNear and the stock kubernetes-resources alerts at once.
          inhibit_rules:
            - source_matchers: [severity = critical]
              target_matchers: [severity =~ warning|info]
              equal: [namespace, alertname]
            - source_matchers: [severity = warning]
              target_matchers: [severity = info]
              equal: [namespace, alertname]
            - source_matchers: [alertname = InfoInhibitor]
              target_matchers: [severity = info]
              equal: [namespace]
            - target_matchers: [alertname = InfoInhibitor]

          route:
            # Everything goes to both channels. Grouping is what keeps that
            # tolerable: one message per (alert, namespace, severity) rather than
            # one per firing instance, so a NAT outage taking out several
            # certificates produces one notification, not forty.
            group_by: [alertname, namespace, severity]
            group_wait: 30s
            group_interval: 5m
            # A still-firing alert re-notifies twice a day. Shorter turns Slack
            # into noise; longer and a problem you scrolled past disappears.
            repeat_interval: 12h
            receiver: lit-all

            routes:
              # Watchdog is the always-firing heartbeat kube-prometheus-stack ships
              # to prove the pipeline works end to end. It MUST stay routed to
              # "null" — the chart default does this, and losing it means being
              # paged every 12 hours forever.
              - matchers: [alertname = "Watchdog"]
                receiver: "null"

              # InfoInhibitor exists only to suppress info-level alerts via the
              # inhibit_rules above; it is a signal to Alertmanager, not to a
              # human. The rule that silences it has no source matcher, so it is
              # only inhibited while some OTHER alert is firing — the moment a
              # real incident clears, InfoInhibitor is left alone and delivers
              # itself. Routing it to "null" is what the chart intends.
              - matchers: [alertname = "InfoInhibitor"]
                receiver: "null"

          receivers:
            - name: "null"

            - name: lit-all
              slack_configs:
                - channel: "#alerts"
                  send_resolved: true
                  title: '{{ `{{ template "lit.slack.title" . }}` }}'
                  text: '{{ `{{ template "lit.slack.text" . }}` }}'
              email_configs:
                # SES is in the sandbox, so this address must be a verified SES
                # identity (aws_ses_email_identity in ses-alerting.tf). Adding a
                # second recipient requires SES production access.
                - to: daniel.m.baranowski@gmail.com
                  send_resolved: true
                  headers:
                    Subject: '{{ `{{ template "lit.email.subject" . }}` }}'
                  html: '{{ `{{ template "lit.email.html" . }}` }}'

        # Wrapped in a single Go raw-string literal ({{ `...` }}) so ESO emits
        # every {{ }} below verbatim instead of evaluating it. Do not introduce a
        # backtick anywhere in this block — it would terminate the literal early
        # and corrupt the config. That is why the runbook link is quoted rather
        # than code-fenced.
        lit.tmpl: |
          {{ `{{ define "lit.slack.title" -}}
          [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
          {{- end }}

          {{ define "lit.slack.text" -}}
          {{ range .Alerts -}}
          *{{ .Labels.severity | toUpper }}* — {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ if .Annotations.runbook }}Runbook: "{{ .Annotations.runbook }}"{{ end }}
          {{ end }}
          {{- end }}

          {{ define "lit.email.subject" -}}
          [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .Alerts | len }})
          {{- end }}

          {{ define "lit.email.html" -}}
          {{ range .Alerts }}
          <p><b>{{ .Labels.severity | toUpper }} — {{ .Annotations.summary }}</b></p>
          <p>{{ .Annotations.description }}</p>
          {{ if .Annotations.runbook }}<p>Runbook: {{ .Annotations.runbook }}</p>{{ end }}
          <hr>
          {{ end }}
          {{- end }}` }}
  data:
    - secretKey: smtp_username
      remoteRef:
        key: lit/staging/alerting
        property: smtp_username
