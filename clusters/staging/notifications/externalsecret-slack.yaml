# The Slack webhook, in the shape Flux's notification-controller demands.
#
# Same webhook, same Secrets Manager entry, as Alertmanager's
# (observability/externalsecret-alertmanager.yaml) — so deploy notifications and
# alerts land in the same #alerts channel and interleave. A deploy immediately
# followed by an alert is the single most useful adjacency in this estate: it
# attributes an incident to a rollout in one glance. Splitting them into
# separate channels would need a SECOND hand-minted webhook, because a Slack
# incoming webhook is bound to exactly one channel.
#
# THE KEY NAME IS NOT A CHOICE. A notification-controller Provider with a
# secretRef reads the endpoint from a key called literally `address`. Rename it
# and the Provider fails to resolve — see provider-slack.yaml.
#
# This is why the property mapping is asymmetric with Alertmanager's: there the
# same value is fetched as `slack_webhook_url`, here it must be `address`.
#
# NAMESPACE: flux-system, not observability. Provider and Alert must live
# together (Alert.spec.providerRef has no namespace field), and the Alerts must
# sit where their event sources are.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-slack
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: flux-slack
    creationPolicy: Owner
    # Retain, for the same reason as the Alertmanager secret: a transient Secrets
    # Manager or ESO failure must not delete the webhook out from under a running
    # notification-controller. Losing it silently disables delivery, and delivery
    # is the only thing that reports a broken deploy.
    deletionPolicy: Retain
  data:
    - secretKey: address
      remoteRef:
        key: lit/staging/alerting
        property: slack_webhook_url
