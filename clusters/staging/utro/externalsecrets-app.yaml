# Third-party app secrets, materialized from AWS Secrets Manager via ESO.
#
# These are NOT provisioned by Terraform — create them yourself under the
# lit/staging/* prefix (the ESO IAM role can read that whole path). Store each
# as a single JSON secret with the properties referenced below:
#
#   aws secretsmanager create-secret --name lit/staging/stripe \
#     --secret-string '{"publishable_key":"pk_...","secret_key":"sk_...","webhook_secret":"whsec_..."}'
#   aws secretsmanager create-secret --name lit/staging/resend \
#     --secret-string '{"api_key":"re_...","webhook_secret":"whsec_..."}'
#   aws secretsmanager create-secret --name lit/staging/twilio \
#     --secret-string '{"account_sid":"AC...","auth_token":"...","from_phone":"+1..."}'
#
# (may-chang used one flat k8s Secret per value with key `value`; grouping by
#  vendor keeps the Secrets Manager entry count down.)
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stripe
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: stripe
    creationPolicy: Owner
  data:
    - secretKey: publishable_key
      remoteRef:
        key: lit/staging/stripe
        property: publishable_key
    - secretKey: secret_key
      remoteRef:
        key: lit/staging/stripe
        property: secret_key
    - secretKey: webhook_secret
      remoteRef:
        key: lit/staging/stripe
        property: webhook_secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: resend
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: resend
    creationPolicy: Owner
  data:
    - secretKey: api_key
      remoteRef:
        key: lit/staging/resend
        property: api_key
    - secretKey: webhook_secret
      remoteRef:
        key: lit/staging/resend
        property: webhook_secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: twilio
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: twilio
    creationPolicy: Owner
  data:
    - secretKey: account_sid
      remoteRef:
        key: lit/staging/twilio
        property: account_sid
    - secretKey: auth_token
      remoteRef:
        key: lit/staging/twilio
        property: auth_token
    - secretKey: from_phone
      remoteRef:
        key: lit/staging/twilio
        property: from_phone
