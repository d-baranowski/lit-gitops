apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Credentials (materialized from AWS Secrets Manager by ESO)
  - externalsecrets-db.yaml
  - externalsecrets-app.yaml
  # Workloads (namespace: default)
  - core-migrate-job.yaml
  - core-deployment.yaml
  - core-service.yaml
  - payment-migrate-job.yaml
  - payment-deployment.yaml
  - payment-service.yaml
  - notification-migrate-job.yaml
  - notification-deployment.yaml
  - notification-service.yaml
  - core-event-migrate-job.yaml
  - core-event-deployment.yaml
  - gateway-deployment.yaml
  - gateway-service.yaml
  - ui-deployment.yaml
  - ui-service.yaml
  # Flux image automation (namespace: flux-system)
  - image-repositories.yaml
  - image-policies.yaml
  - image-update-automation.yaml
