# core-event: Change-Data-Capture service. Consumes the Postgres WAL over a
# logical replication slot (core_event_slot / publication core_event_pub) and
# republishes to pgmq. No API, so no Service — health port only.
#
# Runs as the dedicated `core_event` Aurora role. Four pieces make CDC work on
# Aurora, where the BYPASSRLS attribute the may-chang role relied on is
# unavailable (rds_superuser can't set it):
#   - modules/aurora-postgres sets rds.logical_replication=1 (wal_level=logical);
#   - the Ansible db bootstrap grants rds_replication to core_event (owns the slot);
#   - app migration 20260724000000_core_event_rls_read_policies.sql adds permissive
#     `core_event_read` SELECT policies so enrichment reads of the RLS-protected
#     core tables return rows. (core_event_grants only grants SELECT, which RLS
#     alone filters to zero rows without BYPASSRLS.)
#   - app migration 20260729000000_core_event_leader_election_grants.sql grants
#     INSERT/UPDATE/DELETE on core.leader_election, which the pgstore election
#     loop needs — the schema-wide SELECT is not enough and the campaign fails
#     every tick with "permission denied for table leader_election" without it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: utr-staging-core-event
  namespace: default
  labels:
    app: utr-staging-core-event
spec:
  # Recreate, NOT the default RollingUpdate. This pod owns the single logical
  # replication slot core_event_slot, and Postgres allows only one active
  # consumer per slot. A Deployment's default maxSurge (25%, rounded UP to 1 for
  # a single replica) would start the new pod while the old one still holds the
  # slot, and the new one would fail with "replication slot is active".
  #
  # The StatefulSet this replaced got the same behaviour for free: it terminates
  # the old pod before creating its replacement. Recreate restores that. The
  # cost is a short gap in CDC consumption, which is fine — the slot retains WAL
  # and the consumer resumes from where it left off.
  strategy:
    type: Recreate
  # Single replica: owns one logical replication slot; a second would contend.
  replicas: 1
  selector:
    matchLabels:
      app: utr-staging-core-event
  template:
    metadata:
      labels:
        app: utr-staging-core-event
    spec:
      containers:
      - name: core-event
        image: 277265293752.dkr.ecr.eu-central-1.amazonaws.com/utro-core-event:v0.0.7 # {"$imagepolicy": "flux-system:utr-staging-core-event"}
        ports:
        - containerPort: 18010
          name: health
        env:
        - name: TIMEZONE
          value: "Europe/Warsaw"
        - name: HEALTH_PORT
          value: "18010"
        - name: LOG_LEVEL
          value: "debug"
        - name: SERVICE_VERSION
          value: "v0.0.7" # {"$imagepolicy": "flux-system:utr-staging-core-event:tag"}
        - name: SERVICE_NAME
          value: "rpg.core-event"
        - name: SERVICE_ENV
          value: "staging"
        - name: TR_ENABLED
          value: "true"
        - name: TR_ENDPOINT
          value: "otel-collector.observability.svc.cluster.local:4318"
        - name: TR_HTTPS
          value: "false"
        - name: DB_TRACE
          value: "true"
        - name: DB_SSL
          value: "true"
        - name: DB_NAME
          value: "utro"
        - name: DB_PORT
          value: "5432"
        - name: DB_SEARCH_PATH
          value: "core,public"
        - name: WAL_PUBLICATION_NAME
          value: "core_event_pub"
        - name: WAL_SLOT_NAME
          value: "core_event_slot"
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: db-core-event
              key: host
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-core-event
              key: username
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: db-core-event
              key: password
        livenessProbe:
          httpGet:
            path: /live
            port: health
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: health
          initialDelaySeconds: 60
          periodSeconds: 5
        # Sized from a k6 stress run (60 VU, utro-load.js, 2026-07-29), not from
        # idle: cpu peaked at 2m, but CDC load follows write volume and the run
        # was read-only, so 50m is a floor rather than a measurement.
        # Memory peaked at 29Mi; 128Mi is a floor for GC headroom.
        #
        # No cpu limit, deliberately — a limit throttles the container instead of
        # letting utilization rise and trip the HPA, which is the whole mechanism.
        # Memory is incompressible so it does get one. Requests are also what
        # makes this pod Burstable rather than BestEffort (BestEffort is first in
        # line for eviction) and what Cluster Autoscaler sizes nodes against.
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
