# One-shot DB migration Job for the payment service.
#
# payment's main() only honours the `-migrate=true` CLI flag (no MIGRATE
# env-var fallback), and the image's default ENTRYPOINT wraps the binary in
# `/bin/sh -c /app/payment` (can't take a positional arg) — so we override
# `command` to invoke the binary directly with the flag.
#
# Same Flux re-run-on-image-change semantics as core-migrate-job. Connects as
# the `migrations` Aurora role.
apiVersion: batch/v1
kind: Job
metadata:
  name: utr-staging-payment-migrate
  namespace: default
  labels:
    app: utr-staging-payment-migrate
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: utr-staging-payment-migrate
    spec:
      restartPolicy: OnFailure
      containers:
      - name: migrate
        image: 277265293752.dkr.ecr.eu-central-1.amazonaws.com/utro-payment:v0.0.2 # {"$imagepolicy": "flux-system:utr-staging-payment"}
        command: ["/app/payment"]
        args: ["-migrate=true"]
        env:
        - name: TIMEZONE
          value: "Europe/Warsaw"
        - name: LOG_LEVEL
          value: "debug"
        - name: DB_SSL
          value: "true"
        - name: DB_NAME
          value: "utro"
        - name: DB_PORT
          value: "5432"
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: db-migrations
              key: host
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-migrations
              key: username
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: db-migrations
              key: password
