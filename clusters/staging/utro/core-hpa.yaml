# Scales core on CPU. core is an RPC backend and a pgmq consumer
# (app/core/service/event_consumer.go); it already ran two replicas safely behind
# pgstore leader election, so concurrent replicas are proven rather than assumed.
#
# maxReplicas is 4, not 6: core is database-bound and Aurora Serverless v2 is
# capped at 2 ACU in staging (environments/staging/main.tf), so beyond a point
# extra replicas move the bottleneck into the database instead of adding
# throughput. CPU is a proxy here — queue backlog would be the better signal, but
# pgmq depth is not exported to Prometheus yet.
#
# Requires the metrics-server addon (modules/eks-cluster) AND cpu requests on the
# Deployment: utilization is computed as a percentage of the request, so without
# one the target reads <unknown> and this object does nothing.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: utr-staging-core-hpa
  namespace: default
  labels:
    app: utr-staging-core
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: utr-staging-core
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      # readinessProbe.initialDelaySeconds is 60 on the Go services, so a new pod
      # contributes zero capacity for a full minute. Without a matching window the
      # controller keeps stacking pods against CPU that has not dropped yet.
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      # Slower down than up: shedding a replica during a lull only to re-add it
      # 60s later costs a full cold start each time.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
