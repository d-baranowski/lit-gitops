apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: utr-staging-automation
  namespace: flux-system
spec:
  interval: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
      # Names what actually moved, and to which version.
      #
      # This is not cosmetic: the Flux Alert on this ImageUpdateAutomation
      # (../../notifications/alert-deploys.yaml) sends the RENDERED COMMIT
      # MESSAGE to Slack. With the previous bare template the deploy notification
      # could only say "an automation ran" — this is the one place the service
      # and version are truthfully available at deploy time.
      #
      # `.Changed`, NOT `.Updated`. The CRD in gotk-components.yaml states
      # outright: "The `Updated` template field has been removed. Use `Changed`
      # instead." A template referencing a removed field fails to render, the
      # commit step errors, and NO image update is ever pushed — continuous
      # delivery silently off while ECR and the ImagePolicies still look healthy.
      #
      # .Changed.Objects maps an ObjectIdentifier (Kind/Name) to its changes;
      # each change carries .Setter, .OldValue and .NewValue.
      messageTemplate: |
        Automated image update by {{ .AutomationObject }}

        {{ range $resource, $changes := .Changed.Objects -}}
        {{ $resource.Kind }}/{{ $resource.Name }}
        {{- range $change := $changes }}
          {{ $change.OldValue }} -> {{ $change.NewValue }}
        {{- end }}
        {{ end }}
    push:
      branch: main
  update:
    # Only rewrite the utro app manifests (the $imagepolicy markers live here).
    path: ./clusters/staging/utro
    strategy: Setters
