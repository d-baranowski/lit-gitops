# Aurora connection secrets, pulled from AWS Secrets Manager by the External
# Secrets Operator (ClusterSecretStore aws-secretsmanager, scoped to lit/staging/*).
#
# Terraform's modules/aurora-postgres writes one JSON secret per login role at
#   lit/staging/postgres/<role>
# with keys: username, password, host, reader_host, port, dbname, url.
# Roles provisioned: master, admin, bootstrap, migrations, app (aurora_roles).
# The *roles themselves* are created on the cluster by `infrastructure/ansible/
# bootstrap-db.sh staging` — the ExternalSecret only surfaces the credentials.
#
# Persona -> role mapping (replaces the may-chang Zalando operator secrets):
#   app         -> runtime services (core, gateway, payment, notification) — NON-owner,
#                  fully subject to RLS (the AWS-recommended posture)
#   migrations  -> goose migrate Jobs AND the bootstrap service. This is the table
#                  OWNER: with FORCE removed from core.user/core.user_role, the owner
#                  bypasses RLS and can run migrations + seed data — the Aurora-native
#                  substitute for the may-chang migrator's BYPASSRLS attribute.
#   core_event  -> core-event CDC runtime (rds_replication; owns the logical slot).
#                  Non-owner, so it reads RLS tables via the permissive core_event_read
#                  policies (app migration), not BYPASSRLS.
#
# The `bootstrap` Aurora role still exists (rds_superuser DBA identity) but is no
# longer surfaced in-cluster — nothing runs as it now, so no ExternalSecret for it.
#
# host is surfaced too, so DB_HOST stays endpoint-agnostic (no hard-coded Aurora
# writer endpoint in the manifests).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-app
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: db-app
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: lit/staging/postgres/app
        property: username
    - secretKey: password
      remoteRef:
        key: lit/staging/postgres/app
        property: password
    - secretKey: host
      remoteRef:
        key: lit/staging/postgres/app
        property: host
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-migrations
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: db-migrations
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: lit/staging/postgres/migrations
        property: username
    - secretKey: password
      remoteRef:
        key: lit/staging/postgres/migrations
        property: password
    - secretKey: host
      remoteRef:
        key: lit/staging/postgres/migrations
        property: host
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-core-event
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: db-core-event
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: lit/staging/postgres/core_event
        property: username
    - secretKey: password
      remoteRef:
        key: lit/staging/postgres/core_event
        property: password
    - secretKey: host
      remoteRef:
        key: lit/staging/postgres/core_event
        property: host
