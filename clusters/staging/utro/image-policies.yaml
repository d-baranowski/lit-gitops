# Deploy the highest semver tag. utro-release pushes immutable vX.Y.Z tags to
# ECR; the `v?` keeps compat with bare-semver tags too. NOTE: the utro-build
# Jenkins pipeline pushes :<sha> / :<branch> moving tags — those are ignored by
# this policy on purpose. Only released semver tags roll out to staging.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: utr-staging-core
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: utr-staging-core
  filterTags:
    pattern: '^v?[0-9]+\.[0-9]+\.[0-9]+'
    extract: '$0'
  policy:
    semver:
      range: '>=0.0.0'
---
