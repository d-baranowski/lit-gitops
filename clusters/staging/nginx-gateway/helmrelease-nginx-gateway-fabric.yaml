apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx-gateway-fabric
  namespace: nginx-gateway
spec:
  releaseName: nginx-gateway-fabric
  targetNamespace: nginx-gateway
  interval: 10m
  # Note: helm does NOT block on the NLB here — the chart's own Service is the
  # ClusterIP control-plane one; the LoadBalancer Service is created later, per
  # Gateway, by the NGF provisioner.
  timeout: 10m
  chart:
    spec:
      chart: nginx-gateway-fabric
      version: 2.6.7
      sourceRef:
        kind: HelmRepository
        name: nginx-gateway-fabric
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    nginxGateway:
      # Control plane: reconciles Gateway/HTTPRoute and provisions an nginx
      # Deployment per Gateway. Not on the data path, so one replica is fine —
      # if it dies, existing traffic keeps flowing, only config updates stop.
      replicas: 1
      gatewayClassName: nginx

    nginx:
      kind: deployment

      # --- Availability ---------------------------------------------------
      # The chart default is 1. With externalTrafficPolicy: Local, only nodes
      # running a data plane pod are healthy NLB targets — one replica means one
      # of the two AZs has zero healthy targets by construction.
      replicas: 2

      pod:
        # The labelSelector below MUST match the DATA PLANE pods, which NGF
        # provisions at runtime — not the control plane. NGF labels them
        # (internal/framework/controller/labels.go):
        #   app.kubernetes.io/name            = <generated resource name>
        #   gateway.networking.k8s.io/gateway-name = <Gateway name>
        #
        # So `app.kubernetes.io/name: nginx-gateway-fabric` — the obvious guess,
        # and what the control plane Deployment carries — would match ZERO data
        # plane pods here and the constraint would silently do nothing. Selecting
        # on the gateway-name label is stable and cannot drift.
        #
        # This NginxProxy is global to every Gateway this NGF instance manages.
        # With one Gateway that is exactly right; a second Gateway would need its
        # own NginxProxy referenced from spec.infrastructure.parametersRef, since
        # it would otherwise inherit a selector naming someone else's pods.
        topologySpreadConstraints:
          # HARD guarantee of one replica per AZ.
          #
          # DoNotSchedule is safe despite node_group_min_size: 1. If the cluster
          # ever scales down to a single AZ there is only one topology domain, so
          # the skew is 0 and both pods schedule normally. The constraint only
          # bites when two AZs have nodes — exactly when you want it to.
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: DoNotSchedule
            # Scope the skew calculation to the current ReplicaSet. Without this,
            # old and new pods are both counted during a rolling update and
            # DoNotSchedule deadlocks the rollout. Stable since k8s 1.32; this
            # cluster is 1.34.
            matchLabelKeys:
              - pod-template-hash
            labelSelector:
              matchLabels:
                gateway.networking.k8s.io/gateway-name: utro
          # Soft secondary spread across nodes within a zone.
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            matchLabelKeys:
              - pod-template-hash
            labelSelector:
              matchLabels:
                gateway.networking.k8s.io/gateway-name: utro

      # --- Service / AWS load balancer ------------------------------------
      service:
        type: LoadBalancer
        # Chart default, restated because it is load-bearing: kube-proxy does not
        # SNAT, so nginx sees the real client IP. The cost is that the NLB
        # health-checks nodes on healthCheckNodePort and only nodes running a
        # data plane pod become healthy targets — which is the behaviour the
        # topology spread above exists to guarantee.
        externalTrafficPolicy: Local
        #
        # NO `annotations:` HERE. The chart happily renders nginx.service.annotations
        # into the NginxProxy CR, but the NginxProxy CRD it ships does not declare
        # that field, so the install dies with:
        #   server-side apply failed ... Kind=NginxProxy:
        #   .spec.kubernetes.service.annotations: field not declared in schema
        # (spec.kubernetes.service permits only externalTrafficPolicy,
        #  loadBalancerClass, loadBalancerIP, loadBalancerSourceRanges, nodePorts,
        #  patches and type.)
        #
        # The AWS load-balancer annotations therefore live on the Gateway, at
        # spec.infrastructure.annotations — the standard Gateway API field for
        # exactly this. NGF's provisioner copies them onto every object it builds
        # for the Gateway, including the data plane Service
        # (buildLabelsAndAnnotations -> objectMeta -> buildNginxService).
        # See nginx-gateway/gateway/gateway-utro.yaml.

      container:
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            # Memory only. A CPU limit on a latency-sensitive L7 proxy causes CFS
            # throttling under burst; the request already guarantees the floor.
            memory: 512Mi
