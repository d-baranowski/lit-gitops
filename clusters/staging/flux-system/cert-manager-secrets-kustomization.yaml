# The Cloudflare DNS-01 token, materialised before any ClusterIssuer that needs it.
#
# Exists purely for ordering. cert-manager's issuer controller reads the
# referenced Secret once and does NOT watch it, so an issuer evaluated before
# the Secret lands stays Ready=False/InvalidSolver forever — even after the
# Secret appears and is valid. That cost 2h20m of broken TLS on 2026-07-29 to a
# one-second race (see cert-manager/secrets/kustomization.yaml).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-secrets
  namespace: flux-system
spec:
  dependsOn:
    # The aws-secretsmanager ClusterSecretStore. Without it the ExternalSecret
    # sits in SecretSyncedError and this Kustomization correctly never goes
    # Ready, holding the ClusterIssuers back rather than letting them fail.
    - name: external-secrets-resources
  interval: 10m
  path: ./clusters/staging/cert-manager/secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # This gate is meaningful, unlike the one on cert-manager-resources: an
  # ExternalSecret has a real Ready condition (SecretSynced) that kstatus
  # evaluates, so wait: true genuinely proves the Secret exists downstream.
  wait: true
  timeout: 5m
