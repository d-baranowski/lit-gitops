# ClusterIssuers. The Cloudflare API token ExternalSecret they reference is in a
# separate Kustomization (cert-manager-secrets) that this one waits on.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-resources
  namespace: flux-system
spec:
  dependsOn:
    # ClusterIssuer CRD exists and cert-manager's webhook is serving. Without
    # this the apply fails with either "no matches for kind ClusterIssuer" or
    # 'failed calling webhook "webhook.cert-manager.io": connection refused'.
    - name: cert-manager
    # The Cloudflare token Secret is already SYNCED — not merely that the
    # ClusterSecretStore exists. This ordering is load-bearing: cert-manager
    # reads the referenced Secret once when it evaluates an issuer and never
    # watches it afterwards, so an issuer applied a second too early stays
    # Ready=False/InvalidSolver indefinitely, even once the Secret appears.
    # That is exactly what happened on 2026-07-29 (issuer evaluated 09:28:49,
    # secret created 09:28:50) and it broke TLS for 2h20m.
    #
    # cert-manager-secrets transitively depends on external-secrets-resources,
    # so the ClusterSecretStore is still covered.
    - name: cert-manager-secrets
  interval: 10m
  path: ./clusters/staging/cert-manager/resources
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # CAUTION: wait: true does NOT prove the issuers work. kstatus has no rule for
  # ClusterIssuer, so a CR with a matching observedGeneration reads as Current
  # regardless of its Ready condition — this goes green even if ACME
  # registration failed. Always confirm by hand:
  #   kubectl get clusterissuer
  wait: true
