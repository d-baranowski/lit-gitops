apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
      # No auth block: the ESO controller's service account is bound to an IAM
      # role via EKS Pod Identity (Terraform modules/external-secrets), scoped to
      # lit/staging/*. The controller uses those ambient credentials.
