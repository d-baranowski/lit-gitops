apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  releaseName: external-secrets
  targetNamespace: external-secrets
  interval: 10m
  chart:
    spec:
      chart: external-secrets
      version: 2.8.0
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
  install:
    crds: Create
    createNamespace: true
  upgrade:
    crds: CreateReplace
  values:
    installCRDs: true
    # Controller service account — bound to the IAM role by the Terraform Pod
    # Identity association (modules/external-secrets: namespace external-secrets,
    # sa external-secrets). No IRSA annotation needed with Pod Identity.
    serviceAccount:
      create: true
      name: external-secrets
