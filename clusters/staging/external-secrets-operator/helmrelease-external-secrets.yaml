apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  releaseName: external-secrets
  targetNamespace: external-secrets
  interval: 10m
  chart:
    spec:
      chart: external-secrets
      version: 2.8.0
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
  install:
    crds: Create
    createNamespace: true
  upgrade:
    crds: CreateReplace
  values:
    installCRDs: true
    # Scrape the controller's metrics. This is load-bearing, not nice-to-have.
    #
    # AlertmanagerConfigNotRendered (../observability/resources/
    # prometheusrule-lit-risks.yaml) alerts on externalsecret_status_condition,
    # and that series ONLY exists if this endpoint is scraped. The chart default
    # is serviceMonitor.enabled=false, so the rule could never observe a real
    # sync failure — its absent() branch fired unconditionally instead. That is
    # what produced a CRITICAL page at 03:42 while the ExternalSecret was in
    # fact SecretSynced/Ready with a 4628-byte alertmanager.yaml. An alert that
    # can only false-positive is worse than no alert: it trains you to ignore
    # the one channel that carries real ones.
    #
    # additionalLabels is REQUIRED, not decoration. kube-prometheus-stack leaves
    # serviceMonitorSelectorNilUsesHelmValues at its default of true, which makes
    # its Prometheus discover only ServiceMonitors carrying its own release name.
    # Without this label the ServiceMonitor is created and then silently ignored,
    # which looks identical to the bug being unfixed. Keep it in step with the
    # kube-prometheus-stack HelmRelease's name (it sets no explicit releaseName,
    # so Flux derives the release name from metadata.name).
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
    # Controller service account — bound to the IAM role by the Terraform Pod
    # Identity association (modules/external-secrets: namespace external-secrets,
    # sa external-secrets). No IRSA annotation needed with Pod Identity.
    serviceAccount:
      create: true
      name: external-secrets
